{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
  </head>
  <body>
    <div class="flex items-center justify-center mx-auto p-6">
      <div>
        {% if message %}
        <p>{{message}}</p>
        {% endif %}
      </div>
      <form method="POST">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit" class="bg-red-400 border-2 border-gray-300 px-3 py-2">Submit</button>
      </form>
    </div>
  </body>
</html>
